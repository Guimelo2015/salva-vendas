<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E11D48">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Ofertas relâmpago de Black Friday por tempo limitado. Encomende pelo WhatsApp.">
  <title>Black Friday — Ofertas Relâmpago</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E11D48'/%3E%3Cpath d='M36 6 14 36h15l-3 22 24-32H34z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">

  <style>
    :root {
      --bg: #0B0B0E;
      --surface: #16161D;
      --border: #272732;
      --text: #F5F5F7;
      --muted: #A1A1AE;
      --urgent: #E11D48;
      --gold: #F59E0B;
      --whats: #22C55E;
      --whats-hover: #16A34A;
      --on-whats: #04210F;
      --radius: 14px;
      --gutter: 12px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    a:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .urgency {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 10px;
      padding: calc(8px + env(safe-area-inset-top)) var(--gutter) 8px;
      background: var(--urgent);
      color: #fff;
      font-size: clamp(0.66rem, 3vw, 0.82rem);
      font-weight: 800;
      letter-spacing: 0.03em;
      text-align: center;
      text-transform: uppercase;
      box-shadow: 0 6px 18px rgb(0 0 0 / 0.45);
    }

    .timer {
      padding: 3px 10px;
      border-radius: 8px;
      background: rgb(0 0 0 / 0.32);
      font-size: 1rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-transform: none;
      white-space: nowrap;
    }

    .hero {
      padding-block: 16px 14px;
      text-align: center;
      background: radial-gradient(70% 100% at 50% 0%, rgb(225 29 72 / 0.18), transparent 75%);
    }

    .brand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 10px;
    }

    .brand-name {
      font-size: clamp(1.15rem, 5.5vw, 1.6rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .seal {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px 3px 6px;
      border: 1px solid rgb(245 158 11 / 0.5);
      border-radius: 99px;
      background: rgb(245 158 11 / 0.12);
      color: var(--gold);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .seal svg {
      width: 14px;
      height: 14px;
    }

    .headline {
      max-width: 640px;
      margin: 8px auto 0;
      font-size: clamp(1.25rem, 6vw, 2.2rem);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .promo {
      max-width: 560px;
      margin: 12px auto 0;
      padding: 10px 14px;
      border: 1px dashed var(--gold);
      border-radius: 12px;
      background: linear-gradient(100deg, rgb(245 158 11 / 0.18), rgb(225 29 72 / 0.14));
      color: #FDE7B5;
      font-size: 0.82rem;
      font-weight: 800;
      text-wrap: balance;
    }

    .search {
      position: relative;
      display: block;
      max-width: 480px;
      margin: 12px auto 0;
    }

    .search svg {
      position: absolute;
      top: 50%;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 48px;
      padding: 0 14px 0 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      text-overflow: ellipsis;
    }

    .search input::placeholder {
      color: var(--muted);
      font-size: 0.9rem;
    }

    main {
      flex: 1;
      padding-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      list-style: none;
    }

    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .card-media {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #1F1F29;
    }

    .card-media img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tags {
      position: absolute;
      inset: 6px 6px auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 4px;
    }

    .tag {
      padding: 4px 5px;
      border-radius: 7px;
      font-size: 0.58rem;
      font-weight: 900;
      line-height: 1.25;
      box-shadow: 0 2px 10px rgb(0 0 0 / 0.35);
    }

    .tag-discount {
      flex: none;
      background: var(--urgent);
      color: #fff;
      font-size: 0.68rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .tag-badge {
      min-width: 0;
      margin-left: auto;
      background: var(--gold);
      color: #1C1200;
      text-align: right;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 6px;
      padding: 10px 8px 8px;
    }

    .card-name {
      display: -webkit-box;
      min-height: 2.6em;
      overflow: hidden;
      font-size: 0.86rem;
      font-weight: 600;
      line-height: 1.3;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
    }

    .card-stock {
      color: var(--gold);
      font-size: 0.7rem;
      font-weight: 700;
    }

    .card-price {
      display: flex;
      flex-direction: column;
      margin-top: auto;
      font-variant-numeric: tabular-nums;
    }

    .card-old {
      color: var(--muted);
      font-size: 0.74rem;
    }

    .card-promo {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 4px;
    }

    .card-promo small {
      font-size: 0.72rem;
      font-weight: 600;
    }

    .card-promo strong {
      font-size: clamp(1.2rem, 5.6vw, 1.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      min-height: 50px;
      padding: 7px 8px;
      border-radius: 10px;
      background: var(--whats);
      color: var(--on-whats);
      font-size: 0.8rem;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      touch-action: manipulation;
      transition: background-color 0.15s, transform 0.1s;
    }

    .cta svg {
      flex: none;
      width: 20px;
      height: 20px;
    }

    .cta span {
      text-wrap: balance;
    }

    .cta[href]:hover {
      background: var(--whats-hover);
    }

    .cta[href]:active {
      background: var(--whats-hover);
      transform: scale(0.97);
    }

    .cta[aria-disabled="true"] {
      background: var(--border);
      color: var(--muted);
    }

    .empty {
      padding: 40px 16px;
      color: var(--muted);
      text-align: center;
    }

    .empty a {
      display: inline-block;
      margin-top: 8px;
      padding: 12px;
      color: var(--text);
      font-weight: 700;
    }

    footer {
      padding-block: 26px calc(90px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    footer strong {
      display: block;
      color: var(--text);
      font-size: 1rem;
      font-weight: 800;
    }

    footer p {
      margin-top: 6px;
    }

    .instagram {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 44px;
      margin-top: 6px;
      padding-inline: 12px;
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
    }

    .instagram svg {
      width: 20px;
      height: 20px;
    }

    .disclaimer {
      font-size: 0.74rem;
      font-style: italic;
    }

    .fab {
      position: fixed;
      right: calc(14px + env(safe-area-inset-right));
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 50px;
      height: 50px;
      border: 1px solid #3A3A49;
      border-radius: 99px;
      background: rgb(22 22 29 / 0.94);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.55);
    }

    .fab svg {
      width: 24px;
      height: 24px;
    }

    .fab span {
      display: none;
    }

    .noscript {
      padding: 32px 16px;
      text-align: center;
    }

    @media (min-width: 360px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 720px) {
      :root {
        --gutter: 20px;
      }

      .hero {
        padding-block: 30px 22px;
      }

      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .card-body {
        gap: 8px;
        padding: 14px;
      }

      .card-name {
        font-size: 0.98rem;
      }

      .card-stock {
        font-size: 0.78rem;
      }

      .card-promo strong {
        font-size: 1.55rem;
      }

      .tags {
        inset: 10px 10px auto;
      }

      .tag {
        padding: 5px 8px;
        font-size: 0.7rem;
      }

      .tag-discount {
        font-size: 0.82rem;
      }

      .cta {
        font-size: 0.9rem;
      }

      .fab {
        padding-inline: 18px;
      }

      .fab span {
        display: inline;
      }
    }

    @media (min-width: 1000px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (hover: hover) {
      .card {
        transition: border-color 0.2s, transform 0.2s;
      }

      .card:hover {
        border-color: #45455A;
        transform: translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

      );

      const $ = (selector) => document.querySelector(selector);
      const currency = new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR" });
      const whatsappUrl = (message) => `https://wa.me/${String(STORE_CONFIG.whatsappNumber).replace(/\D/g, "")}?text=${encodeURIComponent(message)}`;
      let ended = false;
      const normalize = (text) => String(text).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

      function renderStore() {
        const { storeName, storeTagline, promoBannerText, instagramHandle, addressOrDeliveryInfo } = STORE_CONFIG;

        document.title = `${storeName} | Black Friday Relâmpago`;
        document.querySelectorAll("[data-store-name]").forEach((element) => {
          element.textContent = storeName;
        });
        $("#tagline").textContent = storeTagline;
        $("#deliveryInfo").textContent = addressOrDeliveryInfo;

        $("#promo").textContent = promoBannerText;
        $("#promo").hidden = !promoBannerText.trim();
        $("#searchBox").hidden = STORE_CONFIG.showSearch === false;

        const handle = instagramHandle.trim().replace(/^@/, "");
        $("#instagram").hidden = !handle;
        $("#instagram").href = `https://www.instagram.com/${encodeURIComponent(handle)}/`;
        $("#instagram span").textContent = `@${handle}`;

        const helpUrl = whatsappUrl(`Olá! Estou na Montra de Black Friday da ${storeName} e queria esclarecer uma dúvida.`);
        $("#fab").href = helpUrl;
        $("#emptyLink").href = helpUrl;
      }

      function createCard(product) {
        const card = $("#cardTemplate").content.firstElementChild.cloneNode(true);
        const find = (selector) => card.querySelector(selector);
        const { name, image, oldPrice, promoPrice, badge, stockLeft } = product;
        const hasDiscount = oldPrice > promoPrice;
        const discount = hasDiscount ? Math.floor(((oldPrice - promoPrice) / oldPrice) * 100 + 1e-9) : 0;

        card.dataset.search = normalize(name);

        const picture = find("img");
        picture.alt = name;
        picture.addEventListener("error", () => {
          picture.src = FALLBACK_IMAGE;
        }, { once: true });
        picture.src = image || FALLBACK_IMAGE;

        find(".tag-discount").textContent = `-${discount}% OFF`;
        find(".tag-discount").hidden = discount < 1;
        find(".tag-badge").textContent = badge || "";
        find(".tag-badge").hidden = !badge;

        find(".card-name").textContent = name;
        find(".card-name").title = name;

        const soldOut = stockLeft === 0;
        if (stockLeft > 0) {
          find(".card-stock").textContent = stockLeft === 1
            ? "🔥 Resta apenas 1 un."
            : `🔥 Restam apenas ${stockLeft} un.`;
          find(".card-stock").hidden = false;
        }

        find(".card-old").textContent = hasDiscount ? `Antes ${currency.format(oldPrice)}` : "";
        find(".card-old").hidden = !hasDiscount;
        find(".card-promo strong").textContent = currency.format(promoPrice);

        const button = find(".cta");
        const label = button.querySelector("span");
        if (soldOut) {
          button.setAttribute("aria-disabled", "true");
          label.textContent = "Esgotado";
        } else if (ended) {
          label.textContent = "Perguntar no WhatsApp";
          button.href = whatsappUrl(`Olá! Vi *${name}* na Montra da ${STORE_CONFIG.storeName}. A campanha terminou, mas queria saber o preço atual.`);
        } else {
          const previous = hasDiscount ? ` de ${currency.format(oldPrice)}` : "";
          button.href = whatsappUrl(
            `Olá! Vi a oferta de *${name}*${previous} por *${currency.format(promoPrice)}* na Montra de Black Friday da ${STORE_CONFIG.storeName} e quero encomendar!`
          );
          button.setAttribute("aria-label", `Encomendar no WhatsApp: ${name}`);
        }

        return card;
      }

      function renderProducts() {
        const fragment = document.createDocumentFragment();
        STORE_CONFIG.products.forEach((product) => fragment.append(createCard(product)));
        $("#grid").replaceChildren(fragment);
      }

      function setupSearch() {
        const input = $("#search");
        const filter = () => {
          const terms = normalize(input.value).split(/\s+/);
          let visible = 0;

          for (const card of $("#grid").children) {
            const match = terms.every((term) => card.dataset.search.includes(term));
            card.hidden = !match;
            visible += match ? 1 : 0;
          }

          $("#empty").hidden = visible > 0;
          $("#searchStatus").textContent = input.value.trim() ? `Ofertas encontradas: ${visible}` : "";
        };

        input.addEventListener("input", filter);
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") input.blur();
        });
        filter();
        return filter;
      }

      function resolveDeadline() {
        const now = Date.now();
        const fixed = Date.parse(STORE_CONFIG.countdownEndDate);
        if (!Number.isNaN(fixed)) return fixed;

        const time = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(String(STORE_CONFIG.countdownEndTime).trim());
        if (time) {
          const today = new Date().setHours(Number(time[1]), Number(time[2]), 0, 0);
          if (today > now) return today;
        }

        const key = `montra:${STORE_CONFIG.storeName}:${STORE_CONFIG.countdownEndTime}`;
        try {
          const saved = Number(localStorage.getItem(key));
          if (saved > now && saved - now <= FALLBACK_WINDOW) return saved;
          localStorage.setItem(key, String(now + FALLBACK_WINDOW));
        } catch {
          return now + FALLBACK_WINDOW;
        }
        return now + FALLBACK_WINDOW;
      }

      function startCountdown(onEnd) {
        const display = $("#timer");
        const pad = (value) => String(value).padStart(2, "0");
        let deadline = resolveDeadline();
        let timeout;

        const tick = () => {
          clearTimeout(timeout);
          if (deadline <= Date.now()) deadline = resolveDeadline();

          const remaining = deadline - Date.now();
          if (remaining <= 0) {
            display.hidden = true;
            $("#urgencyLabel").textContent = "A campanha de Black Friday terminou";
            if (!ended) {
              ended = true;
              onEnd();
            }
            return;
          }

          const seconds = Math.ceil(remaining / 1000);
          display.textContent = `${pad(Math.floor(seconds / 3600))}h : ${pad(Math.floor(seconds / 60) % 60)}m : ${pad(seconds % 60)}s`;
          timeout = setTimeout(tick, (remaining % 1000) || 1000);
        };

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) tick();
        });
        tick();
      }

      async function loadStore(id) {
        const base = BACKEND.supabaseUrl.replace(/\/+$/, "");
        const response = await fetch(`${base}/rest/v1/rpc/obter_montra`, {
          method: "POST",
          headers: {
            apikey: BACKEND.supabaseKey,
            Authorization: `Bearer ${BACKEND.supabaseKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ p_id: id })
        });
        const store = response.ok ? await response.json() : null;
        if (!store) throw new Error("unavailable");
        store.products = store.products.map((item) => ({
          ...item,
          image: `${base}/storage/v1/object/public/montras/${item.photo}`
        }));
        return store;
      }

      async function init() {
        const id = new URLSearchParams(location.search).get("loja");
        const state = $("#state");

        if (id !== null) {
          $("#searchBox").hidden = true;
          $("#fab").hidden = true;
          $("#instagram").hidden = true;
          state.textContent = "A carregar a montra…";
          state.hidden = false;
          try {
            Object.assign(STORE_CONFIG, await loadStore(id));
          } catch {
            $(".urgency").hidden = true;
            state.textContent = "Esta montra ainda não está disponível. Volte a abrir o link dentro de alguns minutos.";
            return;
          }
          state.hidden = true;
          $("#fab").hidden = false;
        }

        renderStore();
        renderProducts();
        const filter = setupSearch();
        startCountdown(() => {
          renderProducts();
          filter();
        });
      }

      init();
    })();
  </script>
</body>
</html>
